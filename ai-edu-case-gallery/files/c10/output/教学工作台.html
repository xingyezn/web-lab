function key(r){return [r.mode,r.cls,r.id,r.period].join('|');}function total(r){return r.scores.reduce((a,b)=>a+b,0);}function msg(t,e=false){$('msg').textContent=t;$('msg').className='status'+(e?' error':'');}function options(id,list,value){$(id).replaceChildren();for(const v of list){let o=document.createElement('option');o.value=v;o.textContent=v;$(id).appendChild(o);}$(id).value=list.includes(value)?value:list[0]||'';return $(id).value;}
function stats(data){let scores=data.map(total),n=scores.length;let scale=mode==='英语'?100:400;return {n,avg:n?scores.reduce((a,b)=>a+b,0)/n:0,pass:n?scores.filter(v=>v>=scale*.6).length/n*100:0,good:n?scores.filter(v=>v>=scale*.85).length/n*100:0};}
function render(){const subset=records.filter(r=>r.mode===mode);cls=options('cls',[...new Set(subset.map(r=>r.cls))].sort(),cls);period=options('period',[...new Set(subset.map(r=>r.period))].sort(),period);const data=subset.filter(r=>r.cls===cls&&r.period===period).sort((a,b)=>a.id.localeCompare(b.id));const s=stats(data);const group=[...new Set(subset.filter(r=>r.period===period).map(r=>r.cls))].map(c=>({cls:c,avg:stats(subset.filter(r=>r.cls===c&&r.period===period)).avg}));const rank=1+group.filter(v=>v.avg>s.avg+1e-8).length;const items=[['学生人数',s.n],['总分均分',s.n?s.avg.toFixed(2):'—'],['及格率',s.n?s.pass.toFixed(1)+'%':'—'],['优秀率',s.n?s.good.toFixed(1)+'%':'—'],['班级均分排序',s.n?rank+' / '+group.length:'—']];$('stats').replaceChildren();for(const [name,value]of items){let d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('strong');a.textContent=name;b.textContent=value;d.append(a,b);$('stats').appendChild(d);}$('thead').replaceChildren();let tr=document.createElement('tr');['学号',...fields[mode],'总分'].forEach(v=>{let th=document.createElement('th');th.textContent=v;tr.appendChild(th);});$('thead').appendChild(tr);$('tbody').replaceChildren();for(const r of data){let tr=document.createElement('tr');[r.id,...r.scores,total(r)].forEach((v,i)=>{let td=document.createElement('td');td.textContent=v;if(i>0)td.className='num';tr.appendChild(td);});$('tbody').appendChild(tr);}chart(subset);}
function chart(subset){const ps=[...new Set(subset.map(r=>r.period))].sort();let vals=ps.map(p=>{const a=subset.filter(r=>r.cls===cls&&r.period===p);return a.length?stats(a).avg:null;});const top=mode==='英语'?100:400,W=1000,H=280,L=70,R=30,T=25,B=50;let X=i=>L+(W-L-R)*i/Math.max(1,ps.length-1),Y=v=>T+(H-T-B)*(1-v/top);let svg='<svg viewBox="0 0 1000 280" role="img" aria-label="总分均分趋势图">';for(let i=0;i<=4;i++){let v=top*i/4,y=Y(v);svg+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#dbe3ed"/><text x="'+(L-12)+'" y="'+(y+5)+'" text-anchor="end" font-size="15" fill="#52677e">'+v+'</text>';}const pts=vals.map((v,i)=>v===null?null:[X(i),Y(v)]).filter(Boolean);svg+='<polyline points="'+pts.map(v=>v.join(',')).join(' ')+'" fill="none" stroke="#006db0" stroke-width="3"/>';vals.forEach((v,i)=>{svg+='<text x="'+X(i)+'" y="265" text-anchor="middle" font-size="16" fill="#172a40">'+ps[i]+'</text>';if(v!==null)svg+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="5" fill="#006db0"/><text x="'+X(i)+'" y="'+(Y(v)-12)+'" text-anchor="middle" font-size="16" fill="#006db0">'+v.toFixed(2)+'</text>';});$('chart').innerHTML=svg+'</svg>';}
function csvParse(t){let rows=[],r=[],s='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){s+='"';i++;}else if(c==='"')q=false;else s+=c;}else if(c==='"')q=true;else if(c===','){r.push(s);s='';}else if(c==='\r'||c==='\n'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(s);if(r.some(v=>v.trim()))rows.push(r);r=[];s='';}else s+=c;}r.push(s);if(r.some(v=>v.trim()))rows.push(r);if(q)throw Error('CSV引号未闭合');return rows;}
function check(r){if(!['英语','综合'].includes(r.mode)||typeof r.cls!=='string'||!r.cls||typeof r.id!=='string'||!r.id||typeof r.period!=='string'||!r.period||!Array.isArray(r.scores)||r.scores.length!==4||r.scores.some((v,i)=>typeof v!=='number'||!Number.isFinite(v)||v<0||v>maxes[r.mode][i]))throw Error('存在不完整或超出范围的记录');return r;}
function importCSV(t){const rows=csvParse(t);if(rows.length<2)throw Error('没有数据行');const h=rows[0].map(s=>s.replace(/^\ufeff/,'').trim());let inferred=h.includes('词汇20')?'英语':h.includes('语文')?'综合':null;if(!inferred)throw Error('无法识别英语或综合表头');const f=fields[inferred];const required=['班级','学号',...f];if(required.some(v=>!h.includes(v)))throw Error('缺少列：'+required.join('、'));let temp=[],keys=new Set();for(let i=1;i<rows.length;i++){const r=rows[i],get=n=>(r[h.indexOf(n)]||'').trim();let sc=f.map(n=>{const v=get(n);if(v==='')throw Error('第'+(i+1)+'行存在空分，未导入');return Number(v);});const item=check({mode:inferred,cls:get('班级'),id:get('学号'),name:get('姓名'),period:h.includes('测评')?get('测评'):(mode===inferred?period:(inferred==='英语'?'测评1':'9月')),scores:sc});const k=key(item);if(keys.has(k))throw Error('文件内部存在重复记录：'+item.id+' / '+item.period);keys.add(k);temp.push(item);}let map=new Map(records.map(r=>[key(r),r]));let updated=0;for(const r of temp){if(map.has(key(r)))updated++;map.set(key(r),r);}records=[...map.values()];mode=inferred;$('mode').value=mode;cls=temp[0].cls;period=temp[0].period;const saved=persist();render();msg('导入'+temp.length+'条：更新'+updated+'条，新增'+(temp.length-updated)+'条。'+saved);return {updated,added:temp.length-updated};}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(records));return '已保存到本机浏览器。';}catch{return '本机保存不可用，请导出JSON备份。';}}
function dl(n,t,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
$('import').onclick=()=>$('file').click();$('file').onchange=async function(){if(!this.files.length)return;try{importCSV(await this.files[0].text());}catch(e){msg(e.message+'，原数据未改变。',true);}this.value='';};$('export').onclick=()=>{let data=records.filter(r=>r.mode===mode&&r.cls===cls&&r.period===period);const q=v=>'"'+String(v).replaceAll('"','""')+'"';const rows=[['班级','学号','测评',...fields[mode]],...data.map(r=>[r.cls,r.id,r.period,...r.scores])];dl('成绩_'+mode+'_'+cls+'_'+period+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');};$('backup').onclick=()=>dl('教学工作台备份.json',JSON.stringify({schema:2,records},null,2),'application/json');$('restore').onclick=()=>$('json').click();$('json').onchange=async function(){if(!this.files.length)return;try{const data=JSON.parse(await this.files[0].text());if(data.schema!==2||!Array.isArray(data.records)||!data.records.length)throw Error('备份格式不正确');const rows=data.records.map(check);if(new Set(rows.map(key)).size!==rows.length)throw Error('备份中有重复记录');records=rows;persist();render();msg('已从JSON恢复'+records.length+'条数据。');}catch(e){msg(e.message,true);}this.value='';};$('reset').onclick=()=>{if(!confirm('恢复示例数据将替换当前本机记录。请先导出JSON备份。'))return;records=structuredClone(DEFAULT);persist();render();msg('已恢复示例示例数据。');};$('mode').onchange=function(){mode=this.value;cls='';period='';render();};$('cls').onchange=function(){cls=this.value;render();};$('period').onchange=function(){period=this.value;render();};try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(Array.isArray(saved)&&saved.length){const checked=saved.map(check);if(new Set(checked.map(key)).size===checked.length)records=checked;}}catch{}render();
