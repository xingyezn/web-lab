<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My School Day 词汇练习</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172a40;font-family:"Microsoft YaHei",Arial,sans-serif;line-height:1.65}header{background:#006db0;color:white;padding:28px max(24px,calc((100vw - 1120px)/2))}h1{margin:0 0 5px;font-size:30px}header p{margin:0;color:#e6f2ff}main{max-width:1120px;margin:auto;padding:24px}h2{font-size:22px;margin:8px 0 14px}section{background:white;padding:24px;margin:0 0 20px;border:1px solid #dbe3ed;border-radius:8px}button,select,input{font:inherit}button,select{padding:10px 16px;border:1px solid #bccbdc;background:white;color:#123859;border-radius:5px;cursor:pointer}button.primary{background:#006db0;color:white;border-color:#006db0}button:hover{background:#e7f2fa;color:#123859}button:disabled{opacity:.6;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e9aa16;outline-offset:3px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.hint{font-size:14px;color:#52677e}.status{min-height:26px;color:#005b47;font-weight:bold}.error{color:#a21c2b}.stats{display:flex;gap:30px;flex-wrap:wrap;padding:12px 0 20px;border-bottom:1px solid #dbe3ed;margin-bottom:18px}.stats strong{display:block;font-size:30px;color:#006db0}.stats span{font-size:14px}table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;border-bottom:1px solid #dde5ed;padding:10px}th{background:#edf4fa}td.num{text-align:right}.scroll{max-height:420px;overflow:auto}footer{max-width:1120px;margin:0 auto;padding:10px 24px 30px;color:#52677e;font-size:14px}label{display:inline-flex;gap:8px;align-items:center}a{color:#006db0}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.options button{font-size:22px;min-height:70px}.word{font-size:48px;font-weight:bold;color:#006db0;margin:20px 0}.good{background:#ecf8f2;border-color:#21865e}.bad{background:#fff0ef;border-color:#bb4255}#feedback{min-height:90px;font-size:20px}svg text{font-family:"Microsoft YaHei",Arial,sans-serif}@media(max-width:650px){main{padding:14px}section{padding:18px}.word{font-size:32px}.options{grid-template-columns:1fr}.stats{gap:18px}h1{font-size:25px}}</style><header><h1>My School Day 词汇练习</h1><p>五年级英语 · 看词选义，再读例句</p></header><main><section><div class="toolbar"><button id="start" class="primary">重新开始</button><button id="retry">重练错词</button><button id="import">导入词库</button><button id="export">导出当前词库</button><input id="file" type="file" accept=".csv" hidden></div><p class="hint">词库表头：word,meaning,example。至少4个不同词条和4种不同词义。导入只在本机保存。</p><p id="message" class="status" role="status" aria-live="polite"></p></section><section><div id="progress"></div><div class="word" id="word"></div><div class="options" id="options"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="primary">下一题</button></section><section><h2>本轮错词</h2><div id="mistakes">本轮还没有错词。</div><p class="hint">课堂建议：选完后读例句，再用这个词说一句自己的话。换一份词库，可以用于新的单元练习。</p></section></main><footer>原创配套练习。离线可用。词义与例句应由教师按本班已学内容核对。</footer><script>
const DEFAULT=[{"word": "get up", "meaning": "起床", "example": "I get up at seven."}, {"word": "have breakfast", "meaning": "吃早餐", "example": "I have breakfast at seven thirty."}, {"word": "go to school", "meaning": "去上学", "example": "I go to school at eight."}, {"word": "English", "meaning": "英语", "example": "I have English on Monday."}, {"word": "maths", "meaning": "数学", "example": "I like maths."}, {"word": "PE", "meaning": "体育", "example": "We have PE in the afternoon."}, {"word": "library", "meaning": "图书馆", "example": "We read in the library."}, {"word": "playground", "meaning": "操场", "example": "We play in the playground."}, {"word": "read", "meaning": "阅读", "example": "I read a book after school."}, {"word": "play", "meaning": "玩耍", "example": "I play with my friends."}, {"word": "homework", "meaning": "家庭作业", "example": "I do my homework at home."}, {"word": "go to bed", "meaning": "上床睡觉", "example": "I go to bed at nine."}]; const STORE='ai4edu-v2-vocab'; let bank=DEFAULT,order=[],index=0,score=0,answered=false,wrong=[];const $=id=>document.getElementById(id);
function parseCSV(t){let rows=[],row=[],s='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){s+='"';i++;}else if(c==='"')q=false;else s+=c;}else if(c==='"')q=true;else if(c===','){row.push(s);s='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(s);if(row.some(v=>v.trim()))rows.push(row);row=[];s='';}else s+=c;}row.push(s);if(row.some(v=>v.trim()))rows.push(row);if(q)throw Error('CSV引号未闭合');return rows;}
function valid(rows){let h=rows[0].map(v=>v.replace(/^\ufeff/,'').trim());let cols=['word','meaning','example'].map(v=>h.indexOf(v));if(cols.some(v=>v<0))throw Error('表头必须包含word、meaning、example');let data=rows.slice(1).map(r=>({word:(r[cols[0]]||'').trim(),meaning:(r[cols[1]]||'').trim(),example:(r[cols[2]]||'').trim()}));if(data.some(r=>!r.word||!r.meaning||!r.example))throw Error('每个词条的三个字段均须填写');if(data.length<4||new Set(data.map(r=>r.word.toLowerCase())).size!==data.length||new Set(data.map(r=>r.meaning)).size<4)throw Error('至少4条，不可重复单词，并需要4种不同词义');return data;}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}function say(t,error=false){$('message').textContent=t;$('message').className='status'+(error?' error':'');}
function begin(items=bank){order=shuffle(items);index=0;score=0;wrong=[];show();}
function show(){answered=false;$('feedback').textContent='';$('options').replaceChildren();$('next').disabled=true;$('mistakes').textContent=wrong.length?wrong.map(v=>v.word+'：'+v.meaning).join('；'):'本轮还没有错词。';if(index>=order.length){$('word').textContent='本轮完成';$('progress').textContent='得分 '+score+' / '+order.length;$('feedback').textContent=wrong.length?'可以重练错词，也可以换一个词说句子。':'全部答对！试着介绍自己的学校生活。';$('next').hidden=true;return;}$('next').hidden=false;let item=order[index];$('progress').textContent='第 '+(index+1)+' / '+order.length+' 题　已答对 '+score+' 题';$('word').textContent=item.word;let distractors=shuffle([...new Set(bank.map(v=>v.meaning).filter(v=>v!==item.meaning))]).slice(0,3);shuffle([item.meaning,...distractors]).forEach(value=>{let b=document.createElement('button');b.textContent=value;b.onclick=()=>{if(answered)return;answered=true;const ok=value===item.meaning;if(ok)score++;else wrong.push(item);for(const el of $('options').children){el.disabled=true;if(el.textContent===item.meaning)el.classList.add('good');}if(!ok)b.classList.add('bad');$('feedback').textContent=(ok?'答对了。':'再记一次：')+item.meaning+'。例句：'+item.example;$('next').disabled=false;$('next').textContent=index===order.length-1?'查看结果':'下一题';};$('options').appendChild(b);});}
$('next').onclick=()=>{if(!answered)return;index++;show();};$('start').onclick=()=>begin();$('retry').onclick=()=>{if(!wrong.length){say('本轮没有错词。');return;}begin([...wrong]);};$('import').onclick=()=>$('file').click();$('file').onchange=async function(){if(!this.files.length)return;try{const data=valid(parseCSV(await this.files[0].text()));bank=data;try{localStorage.setItem(STORE,JSON.stringify(data));say('已导入 '+data.length+' 个词条，并保存到本机。');}catch{say('已导入；浏览器未允许本机保存，请保留CSV。');}begin();}catch(e){say(e.message,true);}this.value='';};
function dl(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
$('export').onclick=()=>{const q=s=>'"'+s.replaceAll('"','""')+'"';dl('英语词库.csv','\ufeffword,meaning,example\r\n'+bank.map(v=>[v.word,v.meaning,v.example].map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');};try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved)bank=valid([['word','meaning','example'],...saved.map(v=>[v.word,v.meaning,v.example])]);}catch{}begin();
</script></html>
